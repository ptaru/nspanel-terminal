name: Release

# Publish a GitHub release when a version tag is pushed, using the matching
# section of CHANGELOG.md as the notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          awk -v version="$version" '
            index($0, "## " version " ") == 1 { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md | awk 'NF { if (!started) started = 1 } started' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "No CHANGELOG.md section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
