# EU NSPanel landscape 454x320. For the US portrait 320x480 panel, see panel-us.yaml.
esphome:
  name: nspanel
  friendly_name: NSPanel
  loop_interval: 1ms

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # Requires an ESP32 revision 3.0 or newer; check your board before flashing.
      minimum_chip_revision: "3.0"
      flash_chip: generic
      # Optional extra IRAM; requires a compatible ESP-IDF bootloader.
      # sram1_as_iram: true
    sdkconfig_options:
      # Known EU NSPanel PSRAM wiring.
      CONFIG_D0WD_PSRAM_CLK_IO: "5"
      CONFIG_D0WD_PSRAM_CS_IO: "18"
      # Optional: remove the default LVGL transition delay for snappier buttons.
      CONFIG_LV_THEME_DEFAULT_TRANSITION_TIME: "0"
      CONFIG_LV_THEME_DEFAULT_GROW: "n"

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

logger:

api:
  actions:
    - action: exit_terminal
      then:
        - lambda: 'id(panel).request_exit();'
    - action: enter_terminal
      then:
        - lambda: 'id(panel).request_enter();'
    - action: upload_tft
      then:
        - lambda: 'id(panel).request_tft_upload();'
    - action: set_brightness
      variables:
        percent: int
      then:
        - lambda: 'id(panel).request_brightness(percent);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "NSPanel Fallback"
    password: !secret ap_password

captive_portal:

# The component comes from the tagged GitHub release. Track `main` instead of
# the tag to follow development, or point a local checkout at `components/`:
#   source:
#     type: local
#     path: /path/to/nspanel-terminal/components
external_components:
  - source: github://ptaru/nspanel-terminal@v0.8.0
    components: [nspanel_terminal]

# Keep the display powered during TFT updates.
switch:
  - platform: gpio
    id: screen_power
    pin:
      number: GPIO4
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

uart:
  id: tf_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 4096
  tx_buffer_size: 2048
  rx_full_threshold: 32

display:
  - platform: nspanel_terminal
    id: panel
    uart_id: tf_uart
    width: 454
    height: 320
    update_interval: never
    auto_clear_enabled: false
    # Frame slots prefer internal RAM by default; use psram to save internal RAM.
    # frame_slots_ram: psram  # Requires psram: and may slow rendering.
    # Place selected LVGL renderer code in IRAM to improve rendering performance.
    # Requires ESP-IDF and additional internal memory.
    lvgl_iram: true
    tft_url: !secret tft_url
    brightness: 100

touchscreen:
  - platform: nspanel_terminal
    id: panel_touch
    display: panel
    calibration:
      x_min: 0
      x_max: 453
      y_min: 0
      y_max: 319

lvgl:
  displays: panel
  touchscreens:
    - touchscreen_id: panel_touch
  color_depth: 16
  widgets:
    - label:
        id: heading
        text: "NSPanel V92"
        x: 20
        y: 20
    - button:
        id: test_button
        x: 20
        y: 70
        width: 220
        height: 70
        widgets:
          - label:
              text: "Tap me"
              align: CENTER
        on_click:
          - lvgl.label.update:
              id: heading
              text: "Touch works"
