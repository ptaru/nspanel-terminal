# EU NSPanel only. The US version is oriented differently.
esphome:
  name: nspanel
  friendly_name: NSPanel

esp32:
  board: esp32dev
  framework:
    type: arduino
    sdkconfig_options:
      # Known EU NSPanel PSRAM wiring.
      CONFIG_D0WD_PSRAM_CLK_IO: "5"
      CONFIG_D0WD_PSRAM_CS_IO: "18"
      # Optional: remove the default LVGL transition delay for snappier buttons.
      CONFIG_LV_THEME_DEFAULT_TRANSITION_TIME: "0"
      CONFIG_LV_THEME_DEFAULT_GROW: "n"

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

logger:

api:
  actions:
    - action: exit_terminal
      then:
        - lambda: 'id(panel).request_exit();'
    - action: enter_terminal
      then:
        - lambda: 'id(panel).request_enter();'
    - action: upload_tft
      then:
        - lambda: 'id(panel).request_tft_upload();'
    - action: set_brightness
      variables:
        percent: int
      then:
        - lambda: 'id(panel).request_brightness(percent);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "NSPanel Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://ptaru/nspanel-terminal@v0.1.0
    components: [nspanel_terminal]
# For local development against a checkout, replace the source with:
#   source:
#     type: local
#     path: ../components

# Keep the display powered during TFT updates.
switch:
  - platform: gpio
    id: screen_power
    pin:
      number: GPIO4
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

uart:
  id: tf_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 4096

display:
  - platform: nspanel_terminal
    id: panel
    uart_id: tf_uart
    update_interval: never
    auto_clear_enabled: false
    tft_url: !secret tft_url
    brightness: 100

touchscreen:
  - platform: nspanel_terminal
    id: panel_touch
    display: panel
    panel_id: panel
    calibration:
      x_min: 0
      x_max: 453
      y_min: 0
      y_max: 319

lvgl:
  displays: panel
  touchscreens:
    - touchscreen_id: panel_touch
  color_depth: 16
  widgets:
    - label:
        id: heading
        text: "NSPanel V92"
        x: 20
        y: 20
    - button:
        id: test_button
        x: 20
        y: 70
        width: 220
        height: 70
        widgets:
          - label:
              text: "Tap me"
              align: CENTER
        on_click:
          - lvgl.label.update:
              id: heading
              text: "Touch works"
