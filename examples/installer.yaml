# EU NSPanel only. The US version is oriented differently.
esphome:
  name: nspanel
  friendly_name: NSPanel

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

# One-time TFT uploader. This image intentionally uses ESPHome's standard
# Nextion component, not nspanel_terminal. Both cannot own the UART at once.
api:
  actions:
    - action: upload_tft
      then:
        - lambda: 'id(disp).upload_tft();'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "NSPanel Fallback"
    password: !secret ap_password

captive_portal:

# Keep the screen powered while the display firmware is being replaced.
switch:
  - platform: gpio
    id: screen_power
    pin:
      number: GPIO4
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

uart:
  id: tf_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 4096

display:
  - platform: nextion
    id: disp
    uart_id: tf_uart
    # Must be reachable from the ESP32 and support HTTP Range requests.
    # Verify the file with tools/verify_tft.py first.
    tft_url: !secret tft_url
